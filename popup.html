<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 16px;
    }
    h1 {
      font-size: 15px;
      color: #22c55e;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h1 .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      display: inline-block;
    }
    .stat {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 13px;
      border-bottom: 1px solid #2a2a4a;
    }
    .stat:last-of-type { border-bottom: none; }
    .stat .label { color: #888; }
    .stat .value { color: #fff; font-weight: 500; }
    .footer {
      margin-top: 12px;
      font-size: 11px;
      color: #555;
      text-align: center;
    }
    .footer a { color: #22c55e; text-decoration: none; }
  </style>
</head>
<body>
  <h1><span class="dot"></span> SuperPSX Patch Checker</h1>
  <div class="stat">
    <span class="label">Title IDs indexed</span>
    <span class="value" id="count">—</span>
  </div>
  <div class="footer">
    Data from <a href="https://github.com/illusionyy/PS-Game-Patch" target="_blank">PS-Game-Patch</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
