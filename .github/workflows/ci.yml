name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: for f in *.js; do node --check "$f"; done
      - name: Python syntax
        run: python3 -m py_compile generate_index.py
      - name: Manifest and index are valid
        run: |
          python3 - <<'PY'
          import json, os
          m = json.load(open('manifest.json'))
          idx = json.load(open('patch_index.json'))
          assert m['manifest_version'] == 3
          files = [m['background']['service_worker'], m['action']['default_popup'], *m['icons'].values()]
          files += [f for cs in m['content_scripts'] for f in cs['js']]
          missing = [f for f in files if not os.path.isfile(f)]
          assert not missing, f'missing files: {missing}'
          assert idx and all(k[:4] in ('CUSA', 'PPSA') for k in idx)
          print(f"manifest {m['version']} ok, {len(idx)} title IDs")
          PY
      - name: Tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(python3 -c "import json;print(json.load(open('manifest.json'))['version'])")" = "$GITHUB_REF_NAME"
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build the extension zip
        run: zip -r "superpsx-patch-checker-$GITHUB_REF_NAME.zip" manifest.json background.js content.js popup.html popup.js patch_index.json icons LICENSE README.md
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "superpsx-patch-checker-$GITHUB_REF_NAME.zip" --clobber
